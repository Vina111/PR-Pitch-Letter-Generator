<title>美讯案例页库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">

<style>
:root{
  --ground:#EAEFF1; --surface:#FFFFFF; --surface-2:#F3F7F8; --sunk:#DFE7EA;
  --ink:#132029; --ink-2:#445866; --ink-3:#7C8F9B;
  --rule:#D2DDE2; --rule-soft:#E4EBEE;
  --accent:#0E747E; --accent-ink:#0A5A62; --accent-soft:#D9EBED;
  --warn:#A2451C; --warn-soft:#F7E7DE;
  --good:#2C7256; --good-soft:#DEEEE6;
  --shadow:0 1px 2px rgba(19,32,41,.06), 0 10px 28px -18px rgba(19,32,41,.34);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E181F; --surface:#16242D; --surface-2:#1B2C36; --sunk:#111D25;
    --ink:#DFE8EC; --ink-2:#A2B4BE; --ink-3:#778B97;
    --rule:#2A3D48; --rule-soft:#223440;
    --accent:#4FB4BC; --accent-ink:#83D2D8; --accent-soft:#12333A;
    --warn:#DB8B62; --warn-soft:#35211A;
    --good:#68B392; --good-soft:#163026;
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 10px 28px -18px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --ground:#0E181F; --surface:#16242D; --surface-2:#1B2C36; --sunk:#111D25;
  --ink:#DFE8EC; --ink-2:#A2B4BE; --ink-3:#778B97;
  --rule:#2A3D48; --rule-soft:#223440;
  --accent:#4FB4BC; --accent-ink:#83D2D8; --accent-soft:#12333A;
  --warn:#DB8B62; --warn-soft:#35211A;
  --good:#68B392; --good-soft:#163026;
  --shadow:0 1px 2px rgba(0,0,0,.34), 0 10px 28px -18px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace}
button{font-family:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ---------- masthead ---------- */
header.top{
  background:var(--surface); border-bottom:1px solid var(--rule);
  padding:20px 26px 16px; display:flex; flex-wrap:wrap; gap:18px 28px;
  align-items:flex-end; justify-content:space-between;
}
header.top h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em}
header.top .sub{font-size:12.5px; color:var(--ink-3); margin-top:3px}
.kpis{display:flex; gap:26px; flex-wrap:wrap}
.kpi{display:flex; flex-direction:column; gap:1px}
.kpi b{font-family:"IBM Plex Mono",monospace; font-size:19px; font-weight:500;
       font-variant-numeric:tabular-nums; line-height:1.2}
.kpi span{font-size:11px; color:var(--ink-3); letter-spacing:.04em}
.kpi.alert b{color:var(--warn)}
.kpi.dup b{color:var(--accent-ink)}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:236px 1fr; align-items:start}
@media(max-width:880px){ .shell{grid-template-columns:1fr} aside{display:none} aside.open{display:block} }

aside{
  position:sticky; top:0; max-height:100vh; overflow-y:auto;
  border-right:1px solid var(--rule); background:var(--surface-2);
  padding:18px 16px 120px;
}
.facet{margin-bottom:20px}
.facet h3{
  margin:0 0 8px; font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:500;
}
.opts{display:flex; flex-wrap:wrap; gap:5px}
.opt{
  border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
  border-radius:999px; padding:3px 9px; font-size:12px; line-height:1.5;
}
.opt:hover{border-color:var(--accent); color:var(--accent-ink)}
.opt[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.opt .n{font-family:"IBM Plex Mono",monospace; font-size:10px; opacity:.7; margin-left:3px}

/* ---------- toolbar ---------- */
.toolbar{
  position:sticky; top:0; z-index:5; background:var(--ground);
  border-bottom:1px solid var(--rule); padding:14px 24px;
  display:flex; gap:12px; align-items:center; flex-wrap:wrap;
}
.search{flex:1 1 260px; position:relative; min-width:200px}
.search input{
  width:100%; border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  border-radius:7px; padding:9px 12px 9px 34px; font-size:14px; font-family:inherit;
}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
.tabs{display:flex; gap:4px; background:var(--sunk); padding:3px; border-radius:8px}
.tab{
  border:0; background:transparent; color:var(--ink-2); font-size:13px;
  padding:6px 12px; border-radius:6px;
}
.tab[aria-selected="true"]{background:var(--surface); color:var(--ink); font-weight:500; box-shadow:var(--shadow)}
.tab .c{font-family:"IBM Plex Mono",monospace; font-size:11px; opacity:.65; margin-left:4px}
.count{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
.ghost{border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
       border-radius:7px; padding:7px 12px; font-size:13px}
.ghost:hover{border-color:var(--accent); color:var(--accent-ink)}

/* ---------- grid ---------- */
main{padding:20px 24px 180px}
.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:9px;
  overflow:hidden; display:flex; flex-direction:column; text-align:left;
  padding:0; color:inherit; transition:border-color .12s, transform .12s;
}
.card:hover{border-color:var(--accent); transform:translateY(-1px)}
.card[data-sel="1"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.thumb{position:relative; aspect-ratio:16/9; background:var(--sunk)}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.uid{
  position:absolute; left:7px; top:7px; font-family:"IBM Plex Mono",monospace;
  font-size:10px; background:rgba(11,20,26,.78); color:#fff; padding:2px 6px; border-radius:4px;
}
.badges{position:absolute; right:7px; top:7px; display:flex; gap:4px}
.badge{font-size:10px; padding:2px 6px; border-radius:4px; font-family:"IBM Plex Mono",monospace}
.badge.warn{background:var(--warn); color:#fff}
.badge.weak{background:#C58A2E; color:#fff}
.badge.dup{background:var(--accent); color:#fff}
.pick{
  position:absolute; right:7px; bottom:7px; width:23px; height:23px; border-radius:6px;
  border:1px solid rgba(255,255,255,.7); background:rgba(11,20,26,.55); color:#fff;
  font-size:13px; line-height:1; display:grid; place-items:center; padding:0;
}
.card[data-sel="1"] .pick{background:var(--accent); border-color:var(--accent)}
.body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:7px; flex:1}
.body .t{font-size:13px; font-weight:500; line-height:1.45;
         display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:auto}
.chip{font-size:10.5px; padding:1.5px 6px; border-radius:4px; background:var(--sunk); color:var(--ink-2)}
.chip.y{background:var(--accent-soft); color:var(--accent-ink); font-family:"IBM Plex Mono",monospace}
.chip.c{background:var(--good-soft); color:var(--good)}
.empty{padding:60px 20px; text-align:center; color:var(--ink-3)}

/* ---------- detail drawer ---------- */
.scrim{position:fixed; inset:0; background:rgba(9,17,22,.5); z-index:20}
.drawer{
  position:fixed; right:0; top:0; bottom:0; width:min(560px,94vw); z-index:21;
  background:var(--surface); border-left:1px solid var(--rule); overflow-y:auto;
  padding:22px 24px 60px; box-shadow:var(--shadow);
}
.drawer h2{margin:0 0 4px; font-size:17px; line-height:1.45}
.drawer .meta{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); margin-bottom:14px}
.drawer img{width:100%; border-radius:7px; border:1px solid var(--rule); display:block; margin-bottom:16px}
.close{position:absolute; right:16px; top:16px; border:0; background:var(--sunk); color:var(--ink-2);
       width:28px; height:28px; border-radius:7px; font-size:15px; line-height:1}
.kv{display:grid; grid-template-columns:74px 1fr; gap:7px 12px; font-size:13px; margin-bottom:16px}
.kv dt{color:var(--ink-3); font-size:12px}
.kv dd{margin:0; display:flex; flex-wrap:wrap; gap:4px}
.conf{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-2); margin-bottom:5px}
.conf .bar{flex:1; height:5px; background:var(--sunk); border-radius:3px; overflow:hidden; max-width:130px}
.conf .bar i{display:block; height:100%; background:var(--good)}
.conf.low .bar i{background:var(--warn)}
.conf .lbl{width:52px; color:var(--ink-3)}
.conf .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; width:32px}
.note{background:var(--warn-soft); border-left:3px solid var(--warn); padding:10px 13px;
      border-radius:0 6px 6px 0; font-size:13px; color:var(--ink-2); margin-bottom:16px}
.raw{background:var(--sunk); border-radius:7px; padding:12px 14px; font-size:12.5px;
     color:var(--ink-2); white-space:pre-wrap; max-height:270px; overflow-y:auto; line-height:1.65}
.sec-t{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.13em;
       text-transform:uppercase; color:var(--ink-3); margin:18px 0 8px}

/* ---------- selection tray ---------- */
.tray{
  position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--surface);
  border-top:1px solid var(--rule); padding:13px 24px; box-shadow:var(--shadow);
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
}
.tray .n{font-size:13.5px; font-weight:500; white-space:nowrap}
.tray .n b{font-family:"IBM Plex Mono",monospace; color:var(--accent-ink); font-size:16px}
.cmd{
  flex:1 1 320px; min-width:0; background:var(--sunk); border-radius:7px; padding:9px 12px;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2);
  overflow-x:auto; white-space:nowrap;
}
.solid{border:1px solid var(--accent); background:var(--accent); color:#fff;
       border-radius:7px; padding:8px 14px; font-size:13px; white-space:nowrap}
.solid:hover{background:var(--accent-ink); border-color:var(--accent-ink)}
</style>

<script id="data" type="application/json">/*__DATA__*/null</script>

<header class="top">
  <div>
    <h1>美讯案例页库</h1>
    <div class="sub" id="srcline"></div>
  </div>
  <div class="kpis" id="kpis"></div>
</header>

<div class="shell">
  <aside id="facets"></aside>
  <div>
    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="q" type="search" placeholder="搜索标题、正文、客户名…  按 / 聚焦" autocomplete="off">
      </div>
      <div class="tabs" id="tabs"></div>
      <span class="count" id="count"></span>
      <button class="ghost" id="clear">清除筛选</button>
    </div>
    <main><div class="grid" id="grid"></div></main>
  </div>
</div>

<div id="tray"></div>
<div id="detail"></div>

<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const PAGES = DATA.pages, THUMBS = DATA.thumbs || {};
const byUid = Object.fromEntries(PAGES.map(p => [p.uid, p]));
const moduleOf = {}; DATA.modules.forEach(m => { if (m.versions > 1) m.members.forEach(u => moduleOf[u] = m); });

const state = { q:"", tab:"all", picks:[], facets:{doc:new Set(),year:new Set(),region:new Set(),
  industry:new Set(),service:new Set(),event:new Set(),type:new Set()} };

const FACETS = [
  {key:"doc",      label:"来源文档", get:p => [p.doc]},
  {key:"year",     label:"案例年份", get:p => p.year ? [p.year] : []},
  {key:"region",   label:"案例地区", get:p => p.regions},
  {key:"industry", label:"案例行业", get:p => p.industries},
  {key:"service",  label:"服务分类", get:p => p.services},
  {key:"event",    label:"展会节点", get:p => p.events},
  {key:"type",     label:"页型",     get:p => [p.pageType]},
];

const isWeak = p => p.weak.length >= 3;
const needsReview = p => p.status !== "pending" || isWeak(p);

function tabMatch(p){
  if (state.tab === "review") return needsReview(p);
  if (state.tab === "dup")    return !!moduleOf[p.uid];
  if (state.tab === "picked") return state.picks.includes(p.uid);
  return true;
}

function facetMatch(p){
  return FACETS.every(f => {
    const want = state.facets[f.key];
    if (!want.size) return true;
    return f.get(p).some(v => want.has(v));
  });
}

function queryMatch(p){
  if (!state.q) return true;
  const hay = (p.title + " " + p.text + " " + p.clients.join(" ") + " " +
               p.industries.join(" ") + " " + p.services.join(" ") + " " + p.uid).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}

const visible = () => PAGES.filter(p => tabMatch(p) && facetMatch(p) && queryMatch(p));

function renderKpis(){
  const dup = DATA.modules.filter(m => m.versions > 1).length;
  const rev = PAGES.filter(needsReview).length;
  document.getElementById("srcline").textContent =
    DATA.docs.map(d => `${d.id} · ${d.title}（${d.pages}页）`).join("　｜　") + `　·　建库于 ${DATA.builtAt}`;
  document.getElementById("kpis").innerHTML = [
    ["", PAGES.length, "总页数"],
    ["", DATA.modules.length, "独立模块"],
    ["dup", dup, "多版本模块"],
    ["alert", rev, "待人工确认"],
  ].map(([cls,n,l]) => `<div class="kpi ${cls}"><b>${n}</b><span>${l}</span></div>`).join("");
}

function renderFacets(){
  const pool = PAGES.filter(p => tabMatch(p) && queryMatch(p));
  document.getElementById("facets").innerHTML = FACETS.map(f => {
    const counts = new Map();
    pool.forEach(p => f.get(p).forEach(v => { if (v) counts.set(v, (counts.get(v)||0)+1); }));
    const sel = state.facets[f.key];
    const opts = [...counts.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
    if (!opts.length) return "";
    return `<div class="facet"><h3>${f.label}</h3><div class="opts">` + opts.map(([v,n]) =>
      `<button class="opt" data-f="${f.key}" data-v="${esc(v)}" aria-pressed="${sel.has(v)}">${esc(v)}<span class="n">${n}</span></button>`
    ).join("") + `</div></div>`;
  }).join("");
}

function renderTabs(){
  const counts = {
    all: PAGES.length,
    review: PAGES.filter(needsReview).length,
    dup: PAGES.filter(p => moduleOf[p.uid]).length,
    picked: state.picks.length,
  };
  document.getElementById("tabs").innerHTML =
    [["all","全部"],["review","待审阅"],["dup","多版本"],["picked","已选"]].map(([k,l]) =>
      `<button class="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}<span class="c">${counts[k]}</span></button>`
    ).join("");
}

function card(p){
  const badges = [];
  if (p.status !== "pending") badges.push(`<span class="badge warn">待确认</span>`);
  else if (isWeak(p)) badges.push(`<span class="badge weak">标签弱</span>`);
  const mod = moduleOf[p.uid];
  if (mod) badges.push(`<span class="badge dup">×${mod.versions}</span>`);
  const chips = [];
  if (p.year) chips.push(`<span class="chip y">${p.year}</span>`);
  p.regions.slice(0,1).forEach(v => chips.push(`<span class="chip">${esc(v)}</span>`));
  p.industries.slice(0,1).forEach(v => chips.push(`<span class="chip">${esc(v)}</span>`));
  p.clients.slice(0,1).forEach(v => chips.push(`<span class="chip c">${esc(v)}</span>`));
  const src = THUMBS[p.uid] ? `data:image/jpeg;base64,${THUMBS[p.uid]}` : "";
  const on = state.picks.includes(p.uid) ? "1" : "0";
  return `<div class="card" data-uid="${p.uid}" data-sel="${on}">
    <div class="thumb">
      ${src ? `<img loading="lazy" src="${src}" alt="${esc(p.title)}">` : ""}
      <span class="uid">${p.uid}</span>
      <div class="badges">${badges.join("")}</div>
      <button class="pick" data-pick="${p.uid}" title="选入拼装">${on==="1"?"✓":"+"}</button>
    </div>
    <div class="body">
      <div class="t">${esc(p.title)}</div>
      <div class="chips">${chips.join("")}</div>
    </div>
  </div>`;
}

function renderGrid(){
  const rows = visible();
  document.getElementById("count").textContent = `${rows.length} / ${PAGES.length} 页`;
  document.getElementById("grid").innerHTML = rows.length
    ? rows.map(card).join("")
    : `<div class="empty" style="grid-column:1/-1">没有匹配的页面 —— 试试放宽筛选或换个关键词</div>`;
}

function renderTray(){
  const t = document.getElementById("tray");
  if (!state.picks.length) { t.innerHTML = ""; return; }
  const cmd = `python3 -m slidehub compose --library build/lib --pages "${state.picks.join(",")}" --out 新案例.pdf`;
  t.innerHTML = `<div class="tray">
    <span class="n">已选 <b>${state.picks.length}</b> 页</span>
    <code class="cmd" id="cmd">${esc(cmd)}</code>
    <button class="solid" id="copy">复制命令</button>
    <button class="ghost" id="unpick">清空</button>
  </div>`;
}

function detail(uid){
  const p = byUid[uid]; if (!p) return;
  const mod = moduleOf[uid];
  const src = THUMBS[uid] ? `data:image/jpeg;base64,${THUMBS[uid]}` : "";
  const kv = [
    ["年份", p.year ? [p.year] : []], ["地区", p.regions], ["行业", p.industries],
    ["服务分类", p.services], ["展会节点", p.events], ["客户", p.clients],
    ["页型", [p.pageType]], ["所属板块", p.section ? [p.section] : []],
    ["最后一次使用", [p.lastUsed || "从未使用"]],
  ].filter(([, v]) => v.length);

  const confRows = [["year","年份"],["region","地区"],["industry","行业"],
                    ["service","服务"],["client","客户"]].map(([k,l]) => {
    const v = p.conf[k] ?? 0, low = v < 0.5;
    return `<div class="conf ${low?"low":""}"><span class="lbl">${l}</span>
      <span class="bar"><i style="width:${Math.round(v*100)}%"></i></span>
      <span class="v">${v.toFixed(2)}</span></div>`;
  }).join("");

  document.getElementById("detail").innerHTML = `<div class="scrim" data-close="1"></div>
  <div class="drawer" role="dialog" aria-label="页面详情">
    <button class="close" data-close="1" aria-label="关闭">✕</button>
    <h2>${esc(p.title)}</h2>
    <div class="meta">${p.uid} · ${esc(p.docTitle)} 第 ${p.index} 页 · 模块 ${p.module || "—"}${
      mod ? ` · 该案例在 ${mod.versions} 份 deck 中出现（${mod.members.join(", ")}）` : ""}</div>
    ${src ? `<img src="${src}" alt="">` : ""}
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
    <dl class="kv">${kv.map(([k,v]) =>
      `<dt>${k}</dt><dd>${v.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</dd>`).join("")}</dl>
    <div class="sec-t">标签置信度</div>${confRows}
    <div class="sec-t">页面文字</div>
    <div class="raw">${esc(p.text) || "（本页无文字层）"}</div>
  </div>`;
}

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderAll(){ renderTabs(); renderFacets(); renderGrid(); renderTray(); }

document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if (pick){
    e.stopPropagation();
    const uid = pick.dataset.pick, at = state.picks.indexOf(uid);
    at === -1 ? state.picks.push(uid) : state.picks.splice(at, 1);
    renderAll(); return;
  }
  const opt = e.target.closest(".opt");
  if (opt){
    const set = state.facets[opt.dataset.f];
    set.has(opt.dataset.v) ? set.delete(opt.dataset.v) : set.add(opt.dataset.v);
    renderAll(); return;
  }
  const tab = e.target.closest(".tab");
  if (tab){ state.tab = tab.dataset.tab; renderAll(); return; }
  if (e.target.closest("#clear")){
    state.q = ""; document.getElementById("q").value = "";
    Object.values(state.facets).forEach(s => s.clear()); state.tab = "all"; renderAll(); return;
  }
  if (e.target.closest("#unpick")){ state.picks = []; renderAll(); return; }
  if (e.target.closest("#copy")){
    const btn = e.target.closest("#copy"), text = document.getElementById("cmd").textContent;
    navigator.clipboard?.writeText(text).then(
      () => { btn.textContent = "已复制"; setTimeout(() => btn.textContent = "复制命令", 1400); },
      () => { btn.textContent = "请手动复制"; });
    return;
  }
  if (e.target.closest("[data-close]")){ document.getElementById("detail").innerHTML = ""; return; }
  const c = e.target.closest(".card");
  if (c) detail(c.dataset.uid);
});

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; renderAll(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("detail").innerHTML = "";
  if (e.key === "/" && document.activeElement.id !== "q"){ e.preventDefault(); document.getElementById("q").focus(); }
});

renderKpis(); renderAll();
</script>
